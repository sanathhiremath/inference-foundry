[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-foundry"
version = "0.1"
description = "A measured, quality-constrained two-model inference router"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.5,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
inference-foundry = "inference_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
